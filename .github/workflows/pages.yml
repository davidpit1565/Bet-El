name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-blocking-resources.mjs
  deploy:
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # publish only what the web app/landing need - never native projects, store metadata, scripts, docs or plist files
      - run: rm -rf ios android fastlane scripts functions docs design design-system resources node_modules .github RELEASE-REPORT.md firebase.json firestore.rules package.json package-lock.json capacitor.config.json CLAUDE.md README.md vercel.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
